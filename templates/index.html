<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heart Disease Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(135deg,#ffeaea,#fff5f5); min-height:100vh; font-family:'Segoe UI',sans-serif; }
    .card { border-radius:20px; box-shadow:0 8px 32px rgba(231,76,60,.12); border:none; }
    h1 { color:#c0392b; font-weight:700; }
    .form-control, .form-select { border-radius:10px; border:1.5px solid #f0c0c0; font-size:13px; }
    .form-control:focus, .form-select:focus { border-color:#e74c3c; box-shadow:0 0 0 3px rgba(231,76,60,.1); }
    .predict-btn { background:linear-gradient(135deg,#e74c3c,#c0392b); color:#fff; border:none; border-radius:12px; padding:13px; font-size:15px; font-weight:600; width:100%; margin-top:1rem; transition:all .3s; }
    .predict-btn:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(231,76,60,.4); color:#fff; }
    .result-box { border-radius:14px; padding:20px; margin-top:1.5rem; text-align:center; display:none; animation:fadeIn .4s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .result-positive { background:#fff8e1; border:2px solid #f59e0b; }
    .result-negative { background:#e8f5e9; border:2px solid #27ae60; }
    .sec-label { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:#e74c3c; margin:1rem 0 .5rem; }
  </style>
</head>
<body>
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7 col-md-9">
      <div class="card p-4">
        <div class="text-center mb-3">
          <div style="font-size:50px">❤️</div>
          <h1>Heart Disease Predictor</h1>
          <p class="text-muted" style="font-size:13px">Patient details bharo — AI se result lo</p>
        </div>
        <div class="sec-label">👤 Patient Info</div>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label fw-500">Age</label><input type="number" id="age" class="form-control" placeholder="e.g. 52"></div>
          <div class="col-md-6"><label class="form-label">Sex</label><select id="sex" class="form-select"><option value="1">Male</option><option value="0">Female</option></select></div>
        </div>
        <div class="sec-label">🩺 Vitals</div>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Blood Pressure</label><input type="number" id="trestbps" class="form-control" placeholder="e.g. 125"></div>
          <div class="col-md-6"><label class="form-label">Cholesterol (mg/dl)</label><input type="number" id="chol" class="form-control" placeholder="e.g. 212"></div>
          <div class="col-md-6"><label class="form-label">Max Heart Rate</label><input type="number" id="thalach" class="form-control" placeholder="e.g. 168"></div>
          <div class="col-md-6"><label class="form-label">ST Depression (oldpeak)</label><input type="number" step="0.1" id="oldpeak" class="form-control" placeholder="e.g. 1.0"></div>
        </div>
        <div class="sec-label">📋 Other</div>
        <div class="row g-3">
          <div class="col-md-6"><label class="form-label">Fasting Blood Sugar >120?</label><select id="fbs" class="form-select"><option value="0">No</option><option value="1">Yes</option></select></div>
          <div class="col-md-6"><label class="form-label">Exercise Angina?</label><select id="exang" class="form-select"><option value="0">No</option><option value="1">Yes</option></select></div>
        </div>
        <button class="predict-btn" id="btn" onclick="predict()">🔍 Predict Now</button>
        <div id="result" class="result-box">
          <div id="res-title" style="font-size:22px;font-weight:700"></div>
          <div id="res-prob" style="font-size:14px;color:#666;margin-top:6px"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
async function predict(){
  const btn=document.getElementById('btn');
  btn.disabled=true; btn.textContent='⏳ Predicting...';
  const data={
    age:+document.getElementById('age').value,
    sex:+document.getElementById('sex').value,
    trestbps:+document.getElementById('trestbps').value,
    chol:+document.getElementById('chol').value,
    thalach:+document.getElementById('thalach').value,
    oldpeak:+document.getElementById('oldpeak').value,
    fbs:+document.getElementById('fbs').value,
    exang:+document.getElementById('exang').value
  };
  try{
    const res=await fetch('/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const json=await res.json();
    const box=document.getElementById('result');
    box.style.display='block';
    box.className='result-box '+(json.prediction===1?'result-positive':'result-negative');
    document.getElementById('res-title').textContent=json.result;
    document.getElementById('res-prob').textContent='Probability: '+json.probability;
  }catch(e){alert('Error: '+e.message);}
  btn.disabled=false; btn.textContent='🔍 Predict Now';
}
</script>
</body>
</html>
